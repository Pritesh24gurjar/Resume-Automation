name: Compile LaTeX Resumes to PDF

on:
  push:
    paths:
      - 'resumes/*.tex'
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Get list of .tex files
        id: tex-files
        run: |
          cd resumes
          files=$(ls *.tex 2>/dev/null | tr '\n' ' ' || echo "")
          echo "files=$files" >> $GITHUB_OUTPUT
          echo "Found files: $files"
      
      - name: Compile each LaTeX file
        if: steps.tex-files.outputs.files != ''
        run: |
          mkdir -p pdfs
          cd resumes
          for file in *.tex; do
            if [ -f "$file" ]; then
              echo "Compiling $file..."
              docker run --rm -v "$(pwd):/work" -w /work texlive/texlive:latest \
                pdflatex -interaction=nonstopmode -halt-on-error "$file" || \
                echo "Warning: Failed to compile $file, continuing..."
              
              # Move PDF if it exists
              basename="${file%.tex}"
              if [ -f "${basename}.pdf" ]; then
                mv "${basename}.pdf" ../pdfs/
                echo "✓ Successfully compiled ${basename}.pdf"
              fi
              
              # Clean up auxiliary files
              rm -f *.aux *.log *.out *.toc *.bbl *.blg
            fi
          done
      
      - name: Upload PDF artifacts
        if: steps.tex-files.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: compiled-resumes-${{ github.run_number }}
          path: pdfs/*.pdf
          if-no-files-found: warn
          retention-days: 90
      
      - name: Commit PDFs to repository
        if: steps.tex-files.outputs.files != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -d "pdfs" ] && [ "$(ls -A pdfs/*.pdf 2>/dev/null)" ]; then
            git add pdfs/*.pdf
            git diff --quiet && git diff --staged --quiet || \
              (git commit -m "🤖 Auto-compiled resumes to PDF [skip ci]" && git push)
            echo "✓ PDFs committed to repository"
          else
            echo "No PDFs to commit"
          fi
