name: Compile LaTeX Resumes to PDF

on:
  push:
    paths:
      - 'resumes/*.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect changed .tex files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            resumes/*.tex
      
      - name: Show changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Changed files:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"
      
      - name: Compile changed LaTeX files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          mkdir -p pdfs
          
          echo "================================================"
          echo "Compiling ${{ steps.changed-files.outputs.all_changed_files_count }} changed file(s)"
          echo "================================================"
          
          for texfile in ${{ steps.changed-files.outputs.all_changed_files }}; do
            filename=$(basename "$texfile" .tex)
            echo ""
            echo "📄 Compiling: $filename"
            
            docker run --rm \
              -v "$PWD:/workspace" \
              -w /workspace \
              texlive/texlive:latest \
              pdflatex \
                -output-directory=resumes \
                -interaction=nonstopmode \
                -file-line-error \
                "$texfile"
            
            if [ -f "resumes/${filename}.pdf" ]; then
              mv "resumes/${filename}.pdf" pdfs/
              echo "✅ ${filename}.pdf created"
            else
              echo "❌ ${filename}.pdf failed"
              exit 1
            fi
            
            # Cleanup
            rm -f resumes/${filename}.{aux,log,out}
          done
          
          echo ""
          echo "📊 Results:"
          ls -lh pdfs/
      
      - name: Upload PDFs
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resume-${{ github.run_number }}
          path: pdfs/*.pdf
      
      - name: Commit PDFs
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add pdfs/
          
          if ! git diff --staged --quiet; then
            count=${{ steps.changed-files.outputs.all_changed_files_count }}
            git commit -m "📄 Compiled $count resume(s) [skip ci]"
            git push
          fi
